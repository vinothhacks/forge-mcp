[package]
name = "forge-mcp"
version = "0.1.0"
edition = "2021"
description = "Forge — Self-Hosted Rust Codebase Search and Intelligence MCP Server"
license = "MIT"
authors = ["Forge Contributors"]
repository = "https://github.com/vinothhacks/forge-mcp"
homepage = "https://github.com/vinothhacks/forge-mcp"
documentation = "https://github.com/vinothhacks/forge-mcp#readme"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "code-search", "tree-sitter", "code-intelligence"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "forge-mcp"
path = "src/main.rs"

[lib]
name = "forge_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.12"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
