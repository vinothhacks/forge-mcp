name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    name: fmt, clippy, version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -j 2 -- -D warnings
      - run: node scripts/check-version.mjs
      - run: node --test scripts/check-version.test.mjs

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust tests
        run: cargo test --locked -j 2 --all-targets -- --test-threads=1
      - name: Release build (used by npm tests)
        run: cargo build --release --locked -j 2
      # The npm package has no dependencies; there is nothing for npm ci to install.
      - name: npm tests
        working-directory: npm
        env:
          FORGE_MCP_SKIP_DOWNLOAD: '1'
        run: npm test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-audit --version '=0.23.0' --locked -j 2
      - run: cargo audit --file Cargo.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm audit
        working-directory: npm

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: always()
    needs: [check, test, audit]
    steps:
      - name: Require all CI jobs to pass
        env:
          CHECK: ${{ needs.check.result }}
          TEST: ${{ needs.test.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          if [[ "$CHECK" != success || "$TEST" != success || "$AUDIT" != success ]]; then
            echo "::error::Required jobs: check=$CHECK test=$TEST audit=$AUDIT"
            exit 1
          fi
